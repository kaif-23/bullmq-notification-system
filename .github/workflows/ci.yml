name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: notification_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d notification_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s

      redis:
        image: redis:7.4.2-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 5s

    env:
      NODE_ENV: test
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      TEST_DB_NAME: notification_test
      TEST_REDIS_HOST: localhost
      TEST_REDIS_PORT: 6379
      TEST_REDIS_DB: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build application production image
        run: docker build --file Dockerfile --tag bullmq-notification-system:ci .

      - name: Build pinned Redis image
        run: docker build --file docker/redis.Dockerfile --tag bullmq-notification-redis:ci .

      - name: Verify application image artifacts and user
        shell: bash
        run: |
          test "$(docker image inspect bullmq-notification-system:ci --format '{{.Config.User}}')" = "node"
          docker run --rm bullmq-notification-system:ci sh -c '
            test "$(id -u)" -ne 0
            test -f dist/migrations/000_initial_schema.sql
            test -f dist/migrations/001_add_outbox_claimed_at.sql
            test -f dist/migrations/002_add_notification_request_fingerprint.sql
            test -f dist/migrations/003_database_constraints_and_indexes.sql
            test -f dist/server.js
            test -f dist/workers/run-email-worker.js
            test -f dist/workers/run-outbox-relay.js
            test -f dist/events/run-email-events.js
            test -f dist/db/run-migrations.js
            test ! -e .env
            test ! -e .env.test
            test ! -e .env.example
            test ! -e .env.test.example
          '

      - name: Run complete test suite
        run: npm test

  publish-image:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
